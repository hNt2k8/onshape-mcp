[project]
name = "onshape-mcp"
version = "0.1.0"
description = "MCP server that drives OnShape CAD (parametric modeling, queries, STL export/verify) via the OnShape REST API"
readme = "README.md"
authors = [
    { name = "kyle", email = "kyle-nelson@berkeley.edu" }
]
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.2",
    "httpx>=0.27",
    "numpy>=1.26",
    "trimesh>=4.0",
    "rtree>=1.0",
    "scipy>=1.11",
    "networkx>=3.0",
    "python-dotenv>=1.0",
]

[project.scripts]
onshape-mcp = "onshape_mcp.cli:main"

[dependency-groups]
dev = ["pytest>=8", "manifold3d>=2.0"]

[tool.uv]
# IMPORTANT: always sync/run with --no-editable on this machine. Something on
# macOS (likely fileproviderd) asynchronously sets the UF_HIDDEN flag on files
# under .venv, and Python >=3.13.8 skips hidden .pth files — which silently
# breaks editable installs minutes after `uv sync`. Non-editable installs
# don't use .pth and are immune. (uv 0.10.9 has no pyproject setting for this,
# hence the flag on every command; install.sh and README embed it.)
# Rebuild the project wheel when sources change (uv only watches pyproject.toml
# by default, which would leave stale code installed after edits).
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.py" }]

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"
